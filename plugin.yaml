name: saitik-interface
version: 1.1.0
description: >-
  Страница вместо чата: экран узла Ткани и прямой доступ к Ткани изнутри шлюза.
  Инструмент screen — сцена задачи, живой ответ, шаги, знаки (лента), сборка действий одним
  вызовом (ops). Инструмент node — чтение и запись узла, симбиозы, создание, загрузка,
  вызов любого инструмента Ткани. Плюс автоматики: действие со знаком «*» шлюз исполняет
  рецептом и глушит сообщение — модель не просыпается.
author: Гермес
provides_tools:
  - screen
  - node
provides_hooks:
  - pre_gateway_dispatch
