name: saitik-interface
version: 1.0.0
description: >-
  Страница вместо чата: экран узла и прямой доступ к Ткани изнутри шлюза.
  Инструмент screen — сцена задачи, живой ответ, шаги, знаки-лента, витрина, уборка;
  сборка нескольких действий одним вызовом (ops). Инструмент node — чтение узла, запись
  языком узла (SaitikLang), симбиозы-врезки, создание узлов, загрузка файлов.
  Навык «как устроена Ткань и форма работы» в комплекте (skill/).
  Нужны MCP-токен и узлы от владельца; профиль агента — в config.yaml (plugins.entries)
  или переменными SAITIK_NODE / SAITIK_HOME / SAITIK_JOURNAL.
author: SYNDICATE
provides_tools:
  - screen
  - node
